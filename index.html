<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaithVerse Bible App</title>
<style>
:root{--bg:#f7f3ec;--card:#fff;--text:#2c241c;--muted:#756b60;--accent:#8b5e34;--accent2:#d9b382;--border:#e8ded2}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#6d4728,#a97846);color:white;padding:28px 18px}
header .wrap{max-width:1100px;margin:auto} h1{margin:0 0 5px;font-size:30px}.subtitle{opacity:.9}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:10px}
.navwrap{max-width:1100px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit} button,.select,input{border:1px solid var(--border);background:var(--card);padding:10px 13px;border-radius:10px;color:var(--text)}
button{cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}button:hover{filter:brightness(.97)}
main{max-width:1100px;margin:22px auto;padding:0 16px}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px}
.search{display:flex;gap:8px;margin-bottom:18px}.search input{flex:1}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 16px #00000008}
.verse{padding:13px 0;border-bottom:1px solid var(--border);line-height:1.65}.verse:last-child{border:0}
.vnum{color:var(--accent);font-weight:700;margin-right:7px}.actions{float:right;display:flex;gap:5px}.small{font-size:13px;padding:6px 8px}.muted{color:var(--muted)}
.side h3{margin-top:0}.pill{display:inline-block;background:#f0e3d3;padding:6px 9px;border-radius:999px;margin:3px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.active{background:var(--accent);color:white}
.empty{padding:35px;text-align:center;color:var(--muted)}
footer{text-align:center;padding:30px;color:var(--muted)}
body.dark{--bg:#171411;--card:#211d19;--text:#f4eadf;--muted:#b9aa9b;--border:#3b332c;--accent:#c28a55;--accent2:#7e5938}
@media(max-width:760px){.toolbar,.grid{grid-template-columns:1fr}.actions{float:none;display:block;margin-top:8px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>📖 FaithVerse Bible</h1><div class="subtitle">Complete King James Version — Old Testament & New Testament</div></div></header>

<nav><div class="navwrap">
<button class="primary" onclick="showReader()">📖 Reader</button>
<button onclick="showFavorites()">⭐ Favorites</button>
<button onclick="showNotes()">📝 Notes</button>
<button onclick="dailyVerse()">✨ Daily Verse</button>
<button onclick="toggleDark()">🌙 Theme</button>
</div></nav>

<main>
<div id="app"></div>
</main>
<footer>FaithVerse Bible • KJV public-domain text • Personal study app</footer>

<script>
const DATA_URL="https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/kjv/kjv.json";
let bible=[], currentBook=null, currentChapter=1, testament="OT";

const OT=["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi"];
const NT=["Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];

function key(book,ch,v){return `${book}|${ch}|${v}`}
function normalizeBookName(name){
 return String(name||"").toLowerCase().replace(/\\./g,"").replace(/\\s+/g," ").trim()
}
function getBook(name){
 const target=normalizeBookName(name);
 const aliases={"psalm":"psalms","song of songs":"song of solomon","revelations":"revelation"};
 const wanted=aliases[target]||target;
 return bible.find(b=>{
   const n=normalizeBookName(b.book);
   return n===wanted || (aliases[n]||n)===wanted;
 });
}
function getVerses(book,ch){let b=getBook(book); if(!b)return []; let c=b.chapters.find(x=>x.chapter==ch); return c?c.verses:[]}

function showReader(){
 document.getElementById("app").innerHTML=`
 <div class="search"><input id="searchBox" placeholder="Search the Bible..." onkeydown="if(event.key==='Enter')searchBible()"><button class="primary" onclick="searchBible()">Search</button></div>
 <div class="toolbar">
   <select id="testament" onchange="changeTestament(this.value)"><option value="OT">Old Testament</option><option value="NT">New Testament</option></select>
   <select id="book" onchange="changeBook(this.value)"></select>
   <select id="chapter" onchange="changeChapter(this.value)"></select>
 </div>
 <div class="grid"><section class="card"><div id="reader"></div></section><aside class="card side"><h3>Study Tools</h3>
 <div class="pill">⭐ Favorites</div><div class="pill">📝 Notes</div><div class="pill">🔎 Search</div><div class="pill">🌙 Dark mode</div>
 <p class="muted">Tip: Tap ⭐ on a verse to save it. Notes and favorites stay in this browser.</p>
 </aside></div>`;
 fillBooks(); renderChapter();
}

function fillBooks(){
 const sel=document.getElementById("book"); if(!sel)return;
 const names=(testament==="OT"?OT:NT).filter(n=>getBook(n));
 sel.innerHTML=names.map(n=>`<option>${n}</option>`).join("");
 if(currentBook && names.includes(currentBook))sel.value=currentBook; else currentBook=names[0],sel.value=currentBook;
 fillChapters();
}
function fillChapters(){
 const sel=document.getElementById("chapter"), b=getBook(currentBook); if(!sel||!b)return;
 sel.innerHTML=b.chapters.map(c=>`<option value="${c.chapter}">Chapter ${c.chapter}</option>`).join("");
 sel.value=currentChapter=Math.min(currentChapter,b.chapters.length);
}
function changeTestament(v){testament=v;currentBook=null;currentChapter=1;fillBooks();renderChapter()}
function changeBook(v){currentBook=v;currentChapter=1;fillChapters();renderChapter()}
function changeChapter(v){currentChapter=+v;renderChapter()}

function renderChapter(){
 const box=document.getElementById("reader"); if(!box)return;
 const verses=getVerses(currentBook,currentChapter);
 box.innerHTML=`<h2>${currentBook} ${currentChapter}</h2>`+verses.map(v=>`
 <div class="verse"><span class="vnum">${v.number}</span>${escapeHTML(v.text)}
 <span class="actions">
 <button class="small" onclick='toggleFav(${JSON.stringify(key(currentBook,currentChapter,v.number))})'>⭐</button>
 <button class="small" onclick='addNote(${JSON.stringify(key(currentBook,currentChapter,v.number))})'>📝</button>
 <button class="small" onclick='shareVerse(${JSON.stringify(currentBook)},${currentChapter},${v.number},${JSON.stringify(v.text)})'>↗</button>
 </span></div>`).join("");
}
function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function toggleFav(k){
 let a=JSON.parse(localStorage.favs||"[]"); a=a.includes(k)?a.filter(x=>x!==k):[...a,k];localStorage.favs=JSON.stringify(a);alert(a.includes(k)?"Added to favorites":"Removed from favorites")
}
function addNote(k){
 const old=JSON.parse(localStorage.notes||"{}"); const n=prompt("Write your note:",old[k]||""); if(n===null)return;
 if(n.trim())old[k]=n;else delete old[k];localStorage.notes=JSON.stringify(old);alert("Note saved.")
}
function showFavorites(){
 const a=JSON.parse(localStorage.favs||"[]");
 document.getElementById("app").innerHTML=`<div class="card"><h2>⭐ Favorites</h2>${a.length?a.map(k=>{let [b,c,v]=k.split("|");let x=getVerses(b,+c).find(z=>z.number==v);return x?`<div class="verse"><b>${b} ${c}:${v}</b> — ${escapeHTML(x.text)} <button class="small" onclick="openRef('${b}',${c})">Open</button></div>`:""}).join(""):"<div class='empty'>No favorite verses yet.</div>"}</div>`;
}
function showNotes(){
 const notes=JSON.parse(localStorage.notes||"{}"), ks=Object.keys(notes);
 document.getElementById("app").innerHTML=`<div class="card"><h2>📝 My Notes</h2>${ks.length?ks.map(k=>`<div class="verse"><b>${k.replaceAll("|",":")}</b><p>${escapeHTML(notes[k])}</p></div>`).join(""):"<div class='empty'>No notes yet.</div>"}</div>`;
}
function openRef(b,c){testament=OT.includes(b)?"OT":"NT";currentBook=b;currentChapter=+c;showReader();document.getElementById("book").value=b;document.getElementById("chapter").value=c;renderChapter()}
function dailyVerse(){
 const all=[]; bible.forEach(b=>b.chapters.forEach(c=>c.verses.forEach(v=>all.push({b:b.book,c:c.chapter,v:v.number,t:v.text}))));
 const d=new Date(), i=(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())%all.length, x=all[i];
 document.getElementById("app").innerHTML=`<div class="card"><h2>✨ Daily Verse</h2><h3>${x.b} ${x.c}:${x.v}</h3><p style="font-size:20px;line-height:1.7">“${escapeHTML(x.t)}”</p><button class="primary" onclick="openRef('${x.b}',${x.c})">Read Chapter</button></div>`;
}
function searchBible(){
 const input=document.getElementById("searchBox");
 const raw=(input?.value||"").trim();
 if(!raw){input?.focus();return}
 if(!bible.length){
   document.getElementById("app").innerHTML=`<div class="card"><h2>🔎 Search</h2><p>The Bible text hasn't loaded yet. Check your internet connection, then try again.</p><button class="primary" onclick="loadBible()">Reload Bible</button></div>`;
   return;
 }
 const results=[];
 // Accept references such as John 3:16, 1 John 3:16, Psalm 23, and John 3:16-18.
 const ref=raw.match(/^(.+?)\\s+(\\d+)(?::(\\d+)(?:\\s*[-–]\\s*(\\d+))?)?$/i);
 let referenceHandled=false;
 if(ref){
   const book=getBook(ref[1]);
   const chapterNumber=Number(ref[2]);
   const firstVerse=ref[3]?Number(ref[3]):null;
   const lastVerse=ref[4]?Number(ref[4]):firstVerse;
   if(book){
     const chapter=book.chapters.find(c=>Number(c.chapter)===chapterNumber);
     if(chapter){
       const selected=chapter.verses.filter(v=>firstVerse===null ||
         (Number(v.number)>=firstVerse && Number(v.number)<=lastVerse));
       if(selected.length){
         selected.forEach(v=>results.push({b:book.book,c:chapterNumber,v:v.number,t:v.text}));
         referenceHandled=true;
       }
     }
   }
 }
 // If the input wasn't a valid reference, search the verse text instead.
 // Ignore punctuation differences and match all words, not just one exact phrase.
 if(!referenceHandled){
   const terms=raw.toLowerCase().replace(/[^\\p{L}\\p{N}\\s]/gu," ").split(/\\s+/).filter(Boolean);
   bible.forEach(b=>b.chapters.forEach(c=>c.verses.forEach(v=>{
     const text=String(v.text||"").toLowerCase();
     const normalized=text.replace(/[^\\p{L}\\p{N}\\s]/gu," ").replace(/\\s+/g," ");
     if(terms.length && terms.every(term=>normalized.includes(term))){
       results.push({b:b.book,c:c.chapter,v:v.number,t:v.text});
     }
   })));
 }
 const shown=results.slice(0,100);
 document.getElementById("app").innerHTML=`<div class="card"><h2>🔎 Search Results</h2><p class="muted">${shown.length} result(s) shown${results.length>100?" (first 100)":""}</p>${shown.map(x=>`<div class="verse"><b>${escapeHTML(x.b)} ${x.c}:${x.v}</b> — ${escapeHTML(x.t)} <button class="small" onclick='openRef(${JSON.stringify(x.b)},${x.c})'>Open</button></div>`).join("")||`<div class="empty">No verses found for “${escapeHTML(raw)}”. Try a reference like John 3:16, a book and chapter like Psalm 23, or a word like love.</div>`}<p><button onclick="showReader()">← Back to Reader</button></p></div>`;
}
async function shareVerse(b,c,v,t){
 const text=`${b} ${c}:${v} — ${t}`;
 if(navigator.share) await navigator.share({title:"Bible Verse",text}); else {await navigator.clipboard.writeText(text);alert("Verse copied!")}
}
function toggleDark(){document.body.classList.toggle("dark");localStorage.dark=document.body.classList.contains("dark")?"1":"0"}

async function loadBible(){
 document.getElementById("app").innerHTML=`<div class="card empty"><h2>Loading Bible…</h2><p>Loading the complete KJV: 66 books, 1,189 chapters, 31,102 verses.</p></div>`;
 try{
  const r=await fetch(DATA_URL); if(!r.ok)throw new Error("Could not load Bible data");
  const data=await r.json();
  let rawBooks=data.books||data;
  if(!Array.isArray(rawBooks) && rawBooks && typeof rawBooks==="object"){
    rawBooks=Object.entries(rawBooks).map(([name,value])=>({book:name,...(value||{})}));
  }
  if(!Array.isArray(rawBooks)) throw new Error("Unexpected Bible data format");
  bible=rawBooks.map((b,bi)=>{
    // Dataset uses OSIS codes in `book` (e.g. Ps, 1Sam, 1John)
    // and human-readable names in `englishName`; use the latter in the UI.
    const bookName=b.englishName||b.name||b.title||b.book;
    let rawChapters=b.chapters||b.chapter||[];
    if(!Array.isArray(rawChapters) && rawChapters && typeof rawChapters==="object"){
      rawChapters=Object.entries(rawChapters).map(([chapter,value])=>({chapter,...(Array.isArray(value)?{verses:value}:value)}));
    }
    const chapters=(Array.isArray(rawChapters)?rawChapters:[]).map((c,i)=>{
      let rawVerses=c.verses||c.text||[];
      if(!Array.isArray(rawVerses) && rawVerses && typeof rawVerses==="object"){
        rawVerses=Object.entries(rawVerses).map(([number,value])=>({number,text:value}));
      }
      return {chapter:Number(c.chapter??c.number??i+1),verses:(Array.isArray(rawVerses)?rawVerses:[]).map((v,j)=>({
        number:Number(v.number??v.verse??j+1),text:String(v.text??v.verse_text??v.content??v)
      }))};
    });
    return {book:String(bookName||""),chapters};
  }).filter(b=>b.book && b.chapters.length);
  if(!bible.length) throw new Error("No Bible books found in the data");
  showReader();
 }catch(e){
  console.error("FaithVerse Bible load error:",e);
  document.getElementById("app").innerHTML=`<div class="card"><h2>Could not load Bible data</h2><p>The Bible dataset could not be loaded or had an unexpected format. Check your internet connection and try again. If you opened this file directly, try running it with VS Code Live Server.</p><p class="muted">Details: ${escapeHTML(e.message||"Unknown error")}</p><button class="primary" onclick="loadBible()">Try Again</button></div>`;
 }
}
if(localStorage.dark==="1")document.body.classList.add("dark");
loadBible();
</script>
</body>
</html>
